name: Apply beta.10 death drop and whip boost

on:
  push:
    branches:
      - agent/beta10-death-drop-whip
    paths:
      - '.github/workflows/apply-beta10.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/beta10-death-drop-whip

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply beta.10 patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          entity = 'src/main/java/atomicstryker/minions/common/entity/MinionEntity.java'
          replace_once(entity,
              '    private int workTicks;\n',
              '    private int workTicks;\n    private int workBoostTicks;\n')

          replace_once(entity,
              '    public boolean isWorking() {\n        return entityData.get(WORKING);\n    }\n',
              '    public boolean isWorking() {\n        return entityData.get(WORKING);\n    }\n\n    /** Applies the legacy owner work boost. Reapplying refreshes the remaining duration. */\n    public void applyWorkBoost(int ticks) {\n        workBoostTicks = Math.max(workBoostTicks, Math.max(0, ticks));\n    }\n')

          replace_once(entity,
              '        tickOwnerDespawn(serverLevel);\n',
              '        if (workBoostTicks > 0) {\n            workBoostTicks--;\n        }\n\n        tickOwnerDespawn(serverLevel);\n')

          replace_once(entity,
              '            workTicks++;\n',
              '            workTicks += workBoostTicks > 0 ? 2 : 1;\n')

          replace_once(entity,
              '    @Override\n    public boolean causeFallDamage(float fallDistance, float damageMultiplier, DamageSource source) {\n',
              '    @Override\n    public void die(DamageSource source) {\n        // The custom 24-slot backpack is not vanilla equipment, so explicitly\n        // empty it into the world before the entity death/removal sequence.\n        if (!level().isClientSide) {\n            dropStoredItems();\n        }\n        super.die(source);\n    }\n\n    @Override\n    public boolean causeFallDamage(float fallDistance, float damageMultiplier, DamageSource source) {\n')

          manager = 'src/main/java/atomicstryker/minions/common/MinionManager.java'
          replace_once(manager,
              '    public static void stopWork(ServerPlayer player) {\n        for (MinionEntity minion : getOwned(player)) {\n            minion.clearWork();\n            minion.clearMoveTarget();\n            minion.setFollowing(false);\n        }\n        playOrder(player, MinionsSounds.RANDOM_ORDER.get());\n    }\n',
              '    public static void stopWork(ServerPlayer player) {\n        for (MinionEntity minion : getOwned(player)) {\n            minion.clearWork();\n            minion.clearMoveTarget();\n            minion.setFollowing(false);\n        }\n        playOrder(player, MinionsSounds.RANDOM_ORDER.get());\n    }\n\n    /**\n     * Restores the old owner-hit work boost as a staff action: all currently\n     * loaded Minions owned by the player work at 2x speed for 30 seconds.\n     */\n    public static boolean boostWork(ServerPlayer player) {\n        List<MinionEntity> minions = getOwned(player);\n        if (minions.isEmpty()) {\n            return false;\n        }\n        for (MinionEntity minion : minions) {\n            minion.applyWorkBoost(20 * 30);\n        }\n        player.serverLevel().playSound(\n                null, player.blockPosition(), MinionsSounds.BOLT.get(), SoundSource.PLAYERS, 1.0F, 1.0F);\n        return true;\n    }\n')

          staff = 'src/main/java/atomicstryker/minions/common/item/MastersStaffItem.java'
          replace_once(staff,
              '        HitResult hit = player.pick(30.0D, 1.0F, false);\n        if (!(hit instanceof BlockHitResult blockHit)) {\n            return;\n        }\n',
              '        HitResult hit = player.pick(30.0D, 1.0F, false);\n        if (hit.getType() == HitResult.Type.MISS) {\n            // Quick right-click into open air: legacy whip/work-speed boost,\n            // without needing to hit a Minion or target a block.\n            MinionManager.boostWork(player);\n            return;\n        }\n        if (!(hit instanceof BlockHitResult blockHit)) {\n            return;\n        }\n')

          replace_once('gradle.properties',
              'mod_version=2.0.3-1.21.1-beta.9',
              'mod_version=2.0.3-1.21.1-beta.10')

          readme = 'README.md'
          replace_once(readme,
              '**`2.0.3-1.21.1-beta.9`**',
              '**`2.0.3-1.21.1-beta.10`**')
          replace_once(readme,
              '- 24-slot Minion backpack\n',
              '- 24-slot Minion backpack; its contents are dropped into the world if the Minion dies\n')
          replace_once(readme,
              '- quick right-click with the Master\'s Staff on a block — summon a missing Minion or move the group\n',
              '- quick right-click with the Master\'s Staff in open air — 30-second 2x work-speed boost for your Minions, with the bolt sound\n- quick right-click with the Master\'s Staff on a block — summon a missing Minion or move the group\n')

      - name: Remove one-shot patch tooling
        run: rm .github/workflows/apply-beta10.yml

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Commit beta.10 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore whip boost and death backpack drops"
          git push origin HEAD:agent/beta10-death-drop-whip
