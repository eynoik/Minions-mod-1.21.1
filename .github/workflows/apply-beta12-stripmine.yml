name: Apply beta.12 strip mine pathing fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-beta12-stripmine.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep patch script and switch to feature branch
        shell: bash
        run: |
          cp .github/beta12_patch.py /tmp/beta12_patch.py
          git fetch origin agent/beta12-stripmine-pathing-work
          git checkout -B beta12-work origin/agent/beta12-stripmine-pathing-work

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply patch
        run: python3 /tmp/beta12_patch.py

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Commit beta.12 source
        shell: bash
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add src/main/java/atomicstryker/minions/common/entity/MinionEntity.java gradle.properties README.md
          git commit -m "Fix strip mine tunnel pathing"
          git push origin HEAD:agent/beta12-stripmine-pathing-work
