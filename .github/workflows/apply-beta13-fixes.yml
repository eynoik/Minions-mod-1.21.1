name: Apply beta.13 Minions fixes

on:
  push:
    branches:
      - agent/beta13-stripmine-chunkloading-work
    paths:
      - '.github/workflows/apply-beta13-fixes.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.13 work branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta13-stripmine-chunkloading-work
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply beta.13 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Master's Staff: remove implicit tree chopping on direct log click.
          staff = Path('src/main/java/atomicstryker/minions/common/item/MastersStaffItem.java')
          s = staff.read_text()
          s = s.replace('import net.minecraft.tags.BlockTags;\n', '', 1)
          old = '''        if (level.getBlockState(clicked).is(BlockTags.LOGS) && MinionManager.hasMinions(player)) {
              if (MinionManager.chopTree(player, clicked)) {
                  player.displayClientMessage(Component.translatable("message.minions.chop"), true);
              }
              return;
          }

          '''
          if old not in s:
              raise SystemExit('direct log click block not found')
          staff.write_text(s.replace(old, '', 1))

          # 2) Strip mine: only blocks in NeoForge's common c:ores tag count as ores.
          manager = Path('src/main/java/atomicstryker/minions/common/MinionManager.java')
          s = manager.read_text()
          import_marker = 'import net.neoforged.neoforge.event.entity.EntityJoinLevelEvent;\n'
          if 'import net.neoforged.neoforge.common.Tags;\n' not in s:
              if import_marker not in s:
                  raise SystemExit('MinionManager import marker not found')
              s = s.replace(import_marker, 'import net.neoforged.neoforge.common.Tags;\n' + import_marker, 1)

          old = '''    private static boolean isValuable(ServerLevel level, BlockPos pos) {
          BlockState state = level.getBlockState(pos);
          if (state.isAir() || state.getDestroySpeed(level, pos) < 0.0F) {
              return false;
          }
          return !state.is(BlockTags.BASE_STONE_OVERWORLD)
                  && !state.is(BlockTags.BASE_STONE_NETHER)
                  && !state.is(BlockTags.DIRT)
                  && !state.is(BlockTags.SAND)
                  && !state.is(BlockTags.LOGS)
                  && !state.is(BlockTags.LEAVES)
                  && !state.is(Blocks.GRAVEL)
                  && !state.is(Blocks.COBBLESTONE)
                  && !state.is(Blocks.OBSIDIAN)
                  && !state.is(Blocks.BEDROCK)
                  && !state.is(Blocks.SNOW)
                  && !state.is(Blocks.SNOW_BLOCK)
                  && !state.is(Blocks.SOUL_SAND)
                  && !state.is(Blocks.SOUL_SOIL)
                  && !state.is(Blocks.CHEST)
                  && !state.is(Blocks.TORCH);
      }
          '''
          new = '''    private static boolean isValuable(ServerLevel level, BlockPos pos) {
          BlockState state = level.getBlockState(pos);
          return !state.isAir()
                  && state.getDestroySpeed(level, pos) >= 0.0F
                  && state.is(Tags.Blocks.ORES);
      }
          '''
          if old not in s:
              raise SystemExit('legacy isValuable block not found')
          s = s.replace(old, new, 1)

          old = '''        for (MinionEntity minion : new ArrayList<>(getOwned(player))) {
              minion.dropStoredItems();
              minion.discard();
              LOADED_MINIONS.remove(minion);
          }
          '''
          new = '''        for (MinionEntity minion : new ArrayList<>(getOwned(player))) {
              minion.dropStoredItems();
              minion.releaseChunkLoading();
              minion.discard();
              LOADED_MINIONS.remove(minion);
          }
          '''
          if old not in s:
              raise SystemExit('unsummon block not found')
          manager.write_text(s.replace(old, new, 1))

          # 3) Register a NeoForge entity chunk-ticket controller.
          mod = Path('src/main/java/atomicstryker/minions/MinionsMod.java')
          s = mod.read_text()
          if 'import net.minecraft.resources.ResourceLocation;\n' not in s:
              s = s.replace('import com.mojang.logging.LogUtils;\n', 'import com.mojang.logging.LogUtils;\nimport net.minecraft.resources.ResourceLocation;\n', 1)
          if 'import net.neoforged.neoforge.common.world.chunk.RegisterTicketControllersEvent;\n' not in s:
              s = s.replace('import net.neoforged.neoforge.event.BuildCreativeModeTabContentsEvent;\n',
                            'import net.neoforged.neoforge.common.world.chunk.RegisterTicketControllersEvent;\nimport net.neoforged.neoforge.common.world.chunk.TicketController;\nimport net.neoforged.neoforge.event.BuildCreativeModeTabContentsEvent;\n', 1)

          old = '''    public static final String MOD_ID = "minions";
      public static final Logger LOGGER = LogUtils.getLogger();
          '''
          new = '''    public static final String MOD_ID = "minions";
      public static final Logger LOGGER = LogUtils.getLogger();
      public static final TicketController MINION_CHUNK_TICKETS = new TicketController(
              ResourceLocation.fromNamespaceAndPath(MOD_ID, "minion_chunks")
      );
          '''
          if old not in s:
              raise SystemExit('MinionsMod static field marker not found')
          s = s.replace(old, new, 1)

          old = '''        modEventBus.addListener(MinionsEntities::registerAttributes);
          modEventBus.addListener(MinionsNetwork::registerPayloads);
          modEventBus.addListener(this::addCreativeTabItems);
          '''
          new = '''        modEventBus.addListener(MinionsEntities::registerAttributes);
          modEventBus.addListener(MinionsNetwork::registerPayloads);
          modEventBus.addListener(MinionsMod::registerTicketControllers);
          modEventBus.addListener(this::addCreativeTabItems);
          '''
          if old not in s:
              raise SystemExit('MinionsMod listener marker not found')
          s = s.replace(old, new, 1)

          method_marker = '''    private void addCreativeTabItems(BuildCreativeModeTabContentsEvent event) {
          '''
          method = '''    private static void registerTicketControllers(RegisterTicketControllersEvent event) {
          event.register(MINION_CHUNK_TICKETS);
      }

''' + method_marker
          if method_marker not in s:
              raise SystemExit('MinionsMod method marker not found')
          mod.write_text(s.replace(method_marker, method, 1))

          # 4) Moving chunk loader + strip-mine unreachable-order recovery.
          entity = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = entity.read_text()
          if 'import atomicstryker.minions.MinionsMod;\n' not in s:
              s = s.replace('package atomicstryker.minions.common.entity;\n\n',
                            'package atomicstryker.minions.common.entity;\n\nimport atomicstryker.minions.MinionsMod;\n', 1)
          if 'import net.minecraft.world.level.ChunkPos;\n' not in s:
              s = s.replace('import net.minecraft.world.level.Level;\n', 'import net.minecraft.world.level.ChunkPos;\nimport net.minecraft.world.level.Level;\n', 1)

          old = '''public final class MinionEntity extends PathfinderMob {
      private static final EntityDataAccessor<String> MASTER_NAME = SynchedEntityData.defineId(
          '''
          new = '''public final class MinionEntity extends PathfinderMob {
      private static final int NO_FORCED_CHUNK = Integer.MIN_VALUE;
      private static final EntityDataAccessor<String> MASTER_NAME = SynchedEntityData.defineId(
          '''
          if old not in s:
              raise SystemExit('MinionEntity class marker not found')
          s = s.replace(old, new, 1)

          old = '''    private boolean forceReturnGoods;
      private boolean stripMining;
      private WorkOrder activeOrder;
          '''
          new = '''    private boolean forceReturnGoods;
      private boolean stripMining;
      private int forcedChunkX = NO_FORCED_CHUNK;
      private int forcedChunkZ = NO_FORCED_CHUNK;
      private int forcedChunkRadius = -1;
      private WorkOrder activeOrder;
          '''
          if old not in s:
              raise SystemExit('MinionEntity field marker not found')
          s = s.replace(old, new, 1)

          old = '''        if (!(level() instanceof ServerLevel serverLevel)) {
              return;
          }

          if (workBoostTicks > 0) {
          '''
          new = '''        if (!(level() instanceof ServerLevel serverLevel)) {
              return;
          }

          updateChunkLoading(serverLevel);

          if (workBoostTicks > 0) {
          '''
          if old not in s:
              raise SystemExit('MinionEntity tick marker not found')
          s = s.replace(old, new, 1)

          marker = '''    private void tickOwnerDespawn(ServerLevel level) {
          '''
          helper = '''    private void updateChunkLoading(ServerLevel level) {
          int radius = needsWorkAreaChunkLoading() ? 1 : 0;
          ChunkPos current = chunkPosition();
          if (forcedChunkX == current.x && forcedChunkZ == current.z && forcedChunkRadius == radius) {
              return;
          }

          releaseChunkLoading(level);
          setChunkAreaForced(level, current.x, current.z, radius, true);
          forcedChunkX = current.x;
          forcedChunkZ = current.z;
          forcedChunkRadius = radius;
      }

      private boolean needsWorkAreaChunkLoading() {
          return !workQueue.isEmpty()
                  || moveTarget != null
                  || carryTargetUUID != null
                  || inventoryFull
                  || forceReturnGoods
                  || (!inventory.isEmpty() && returnContainer != null);
      }

      private void setChunkAreaForced(ServerLevel level, int centerX, int centerZ, int radius, boolean add) {
          for (int dx = -radius; dx <= radius; dx++) {
              for (int dz = -radius; dz <= radius; dz++) {
                  MinionsMod.MINION_CHUNK_TICKETS.forceChunk(
                          level, getUUID(), centerX + dx, centerZ + dz, add, true);
              }
          }
      }

      public void releaseChunkLoading() {
          if (level() instanceof ServerLevel serverLevel) {
              releaseChunkLoading(serverLevel);
          }
      }

      private void releaseChunkLoading(ServerLevel level) {
          if (forcedChunkRadius < 0 || forcedChunkX == NO_FORCED_CHUNK || forcedChunkZ == NO_FORCED_CHUNK) {
              return;
          }
          setChunkAreaForced(level, forcedChunkX, forcedChunkZ, forcedChunkRadius, false);
          forcedChunkX = NO_FORCED_CHUNK;
          forcedChunkZ = NO_FORCED_CHUNK;
          forcedChunkRadius = -1;
      }

''' + marker
          if marker not in s:
              raise SystemExit('tickOwnerDespawn marker not found')
          s = s.replace(marker, helper, 1)

          old = '''        if (ownerMissingTicks >= delayTicks) {
              dropStoredItems();
              discard();
          }
          '''
          new = '''        if (ownerMissingTicks >= delayTicks) {
              dropStoredItems();
              releaseChunkLoading(level);
              discard();
          }
          '''
          if old not in s:
              raise SystemExit('owner despawn marker not found')
          s = s.replace(old, new, 1)

          old = '''        } else if (stripMining) {
              // Never ask vanilla navigation to path into the still-solid block.
              // Pick a two-block-tall air position in the already opened tunnel
              // that remains inside the normal three-block work reach instead.
              navigationTarget = findStripMineWorkPosition(level, target);
          } else {
              navigationTarget = target;
          }

          if (stripMining && Math.abs(getY() - navigationTarget.getY()) > 3.0D) {
          '''
          new = '''        } else if (stripMining) {
              // Never ask vanilla navigation to path into the still-solid block.
              // Pick a two-block-tall air position in the already opened tunnel
              // that remains inside the normal three-block work reach instead.
              navigationTarget = findStripMineWorkPosition(level, target);
              if (navigationTarget == null) {
                  // beta.12 fell back to the Minion's own position here. Vanilla
                  // navigation could report that as a successful path forever,
                  // leaving the queue permanently stuck on one unreachable order.
                  stuckTicks++;
                  if (stuckTicks > 40) {
                      completeCurrentOrder(level);
                  }
                  return;
              }
          } else {
              navigationTarget = target;
          }

          if (stripMining && Math.abs(getY() - navigationTarget.getY()) > 3.0D) {
          '''
          if old not in s:
              raise SystemExit('strip navigation block not found')
          s = s.replace(old, new, 1)

          old = '''                } else if (stripMining) {
                      safe = findStripMineWorkPosition(level, target);
                  } else {
                      safe = findSafeTeleport(level, target);
                  }
                  teleportTo(safe.getX() + 0.5D, safe.getY(), safe.getZ() + 0.5D);
          '''
          new = '''                } else if (stripMining) {
                      safe = findStripMineWorkPosition(level, target);
                      if (safe == null) {
                          completeCurrentOrder(level);
                          return;
                      }
                  } else {
                      safe = findSafeTeleport(level, target);
                  }
                  teleportTo(safe.getX() + 0.5D, safe.getY(), safe.getZ() + 0.5D);
          '''
          if old not in s:
              raise SystemExit('strip recovery block not found')
          s = s.replace(old, new, 1)

          old = '''        // Never fall back to the generic upward recovery scan for strip mining.
          // If a valid tunnel access cell does not exist yet, staying put is safer
          // than walking to the surface and teleporting down again.
          return best == null ? blockPosition().immutable() : best;
      }
          '''
          new = '''        // Null means the order is currently unreachable from any legal tunnel
          // standing cell. tickWork counts this as an actual stall instead of
          // pathing to the Minion's own position forever.
          return best;
      }
          '''
          if old not in s:
              raise SystemExit('findStripMineWorkPosition fallback not found')
          s = s.replace(old, new, 1)

          old = '''        if (!level().isClientSide) {
              dropStoredItems();
          }
          super.die(source);
          '''
          new = '''        if (!level().isClientSide) {
              dropStoredItems();
              releaseChunkLoading();
          }
          super.die(source);
          '''
          if old not in s:
              raise SystemExit('die marker not found')
          entity.write_text(s.replace(old, new, 1))

          # 5) Version/readme for beta.13.
          gradle = Path('gradle.properties')
          g = gradle.read_text()
          if 'mod_version=2.0.3-1.21.1-beta.12' not in g:
              raise SystemExit('beta.12 version marker missing')
          gradle.write_text(g.replace('mod_version=2.0.3-1.21.1-beta.12', 'mod_version=2.0.3-1.21.1-beta.13', 1))

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('**Current version: `2.0.3-1.21.1-beta.12`**',
                        '**Current version: `2.0.3-1.21.1-beta.13`**', 1)
          r = r.replace('- 1x2 strip mining with ore scanning, floor repair and torches',
                        '- 1x2 strip mining with `c:ores` scanning, stall recovery, floor repair and torches', 1)
          direct_log = '- right-click a log — harvest nearby trees\n'
          if direct_log not in r:
              raise SystemExit('README direct log control missing')
          r = r.replace(direct_log, '', 1)
          readme.write_text(r)
          PY

      - name: Build beta.13
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit beta.13 source
        shell: bash
        run: |
          rm .github/workflows/apply-beta13-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strip mining and restore Minion chunk loading"
          git push origin HEAD:agent/beta13-stripmine-chunkloading-work
