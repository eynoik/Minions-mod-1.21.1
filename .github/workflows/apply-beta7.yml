name: Apply beta.7 parity fixes

on:
  push:
    branches:
      - agent/beta7-parity-fixes
    paths:
      - 'tools/apply_beta7.py'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/beta7-parity-fixes

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply patch
        run: python tools/apply_beta7.py

      - name: Remove one-shot patch tooling
        run: rm tools/apply_beta7.py .github/workflows/apply-beta7.yml

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Commit patched source
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore mining drops animation menu gating and hazard immunity"
          git push origin HEAD:agent/beta7-parity-fixes
