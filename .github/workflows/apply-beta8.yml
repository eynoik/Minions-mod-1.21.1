name: Apply beta.8 whole-tree parity

on:
  push:
    branches:
      - agent/beta8-whole-tree-chop
    paths:
      - '.github/workflows/apply-beta8.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/beta8-whole-tree-chop
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply beta.8 patch
        run: python tools/apply_beta8.py

      - name: Remove one-shot patch tooling
        run: rm -f tools/apply_beta8.py .github/workflows/apply-beta8.yml

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Commit beta.8 source
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore whole-tree chopping behavior"
          git push origin HEAD:agent/beta8-whole-tree-chop
