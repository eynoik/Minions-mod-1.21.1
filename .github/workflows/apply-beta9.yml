name: Apply beta.9 final polish

on:
  push:
    branches:
      - agent/beta9-final-polish
    paths:
      - '.github/workflows/apply-beta9.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/beta9-final-polish
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply beta.9 patch
        run: python tools/apply_beta9.py

      - name: Remove one-shot patch tooling
        run: rm -f tools/apply_beta9.py .github/workflows/apply-beta9.yml

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Commit beta.9 source
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Add Minion fall and staff-lightning immunity"
          git push origin HEAD:agent/beta9-final-polish
