name: Beta4 strip independence fix

on:
  push:
    branches:
      - agent/parity-workflow-beta4
    paths:
      - .github/workflows/beta4-strip-independence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-workflow-beta4
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Keep strip queues independent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/atomicstryker/minions/common/MinionManager.java')
          s = p.read_text()
          old = '            int phase = step + 1;\n            BlockPos base = start.relative(forward, step);\n'
          new = '            int phase = -1; // independent single-Minion strip queue; do not join shared layer barriers\n            BlockPos base = start.relative(forward, step);\n'
          if old not in s:
              raise SystemExit('strip phase target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/beta4-strip-independence.yml
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Keep independent strip mines unsynchronized"
          git push origin agent/parity-workflow-beta4
