name: Build Dziadziu Big Bonzo

on:
  push:
    branches:
      - build/dziadziu-big-bonzo
    paths:
      - 'dziadziu-big-bonzo/**'
      - '.github/workflows/build-dziadziu-bonzo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Unpack standalone project
        shell: bash
        run: |
          rm -rf dziadziu-big-bonzo/work
          mkdir -p dziadziu-big-bonzo/work
          base64 -d dziadziu-big-bonzo/project.tar.gz.b64 | tar -xzf - -C dziadziu-big-bonzo/work

      - name: Build mod
        shell: bash
        run: |
          cd dziadziu-big-bonzo/work
          gradle build --stacktrace --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dziadziu-Big-Bonzo-1.0.0-neoforge-1.21.1
          path: dziadziu-big-bonzo/work/build/libs/*.jar
          if-no-files-found: error
