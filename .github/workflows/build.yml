name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-beta16:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/beta16-gravel-shaft'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta16-gravel-shaft
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Add real falling-block settle wait
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = p.read_text()

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: marker not found')
              s = s.replace(old, new, 1)

          one(
              '    private int workBoostTicks;\n',
              '    private int workBoostTicks;\n    private int shaftGravityWaitTicks;\n    private boolean shaftWaitingForGravity;\n',
              'gravity fields')

          one(
              '''        if (isBreakAction(order.action())) {
            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {
                completeCurrentOrder(level);
                return;
            }
        } else {''',
              '''        if (isBreakAction(order.action())) {
            if (order.action() == WorkAction.SHAFT_BREAK && shaftWaitingForGravity) {
                if (state.isAir()) {
                    shaftGravityWaitTicks++;
                    if (shaftGravityWaitTicks < 10) {
                        entityData.set(WORKING, false);
                        navigation.stop();
                        return;
                    }
                    shaftWaitingForGravity = false;
                    shaftGravityWaitTicks = 0;
                    completeCurrentOrder(level);
                    return;
                }
                shaftWaitingForGravity = false;
                shaftGravityWaitTicks = 0;
            }
            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {
                completeCurrentOrder(level);
                return;
            }
        } else {''',
              'gravity validation')

          old = '''          BlockState above = level.getBlockState(target.above());
          if (above.getBlock() instanceof FallingBlock) {
              workTicks = 0;
              stuckTicks = 0;
              return;
          }'''
          new = '''          BlockState above = level.getBlockState(target.above());
          if (above.getBlock() instanceof FallingBlock || state.getBlock() instanceof FallingBlock) {
              shaftWaitingForGravity = true;
              shaftGravityWaitTicks = 0;
              workTicks = 0;
              stuckTicks = 0;
              return;
          }'''
          one(old, new, 'gravity retention')

          one(
              '''        workTicks = 0;
        stuckTicks = 0;
        entityData.set(WORKING, false);''',
              '''        workTicks = 0;
        stuckTicks = 0;
        shaftGravityWaitTicks = 0;
        shaftWaitingForGravity = false;
        entityData.set(WORKING, false);''',
              'complete reset')

          one(
              '''        activeTreeLeaves = List.of();
        workTicks = 0;
    }

    private BlockState desiredState''',
              '''        activeTreeLeaves = List.of();
        workTicks = 0;
        shaftGravityWaitTicks = 0;
        shaftWaitingForGravity = false;
    }

    private BlockState desiredState''',
              'active reset')

          p.write_text(s)
          PY

      - name: Build refined beta.16
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit refined beta.16
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main/java/atomicstryker/minions/common/entity/MinionEntity.java
          if ! git diff --cached --quiet; then
            git commit -m "Wait for falling blocks to settle in mineshafts"
            git push origin HEAD:agent/beta16-gravel-shaft
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minions-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
