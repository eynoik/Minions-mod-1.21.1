name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-beta16:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/beta16-gravel-shaft'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: runner
          fetch-depth: 1

      - name: Checkout beta.16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta16-gravel-shaft
          path: work
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: work/gradle/wrapper/gradle-wrapper.properties

      - name: Apply beta.16 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          workflow = Path('runner/.github/workflows/patch-beta16-gravel-shaft.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('embedded beta.16 patch script not found')
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          os.chdir('work')
          exec(compile(code, 'beta16_patch.py', 'exec'))
          PY

      - name: Build patched beta.16
        working-directory: work
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit patched source
        working-directory: work
        shell: bash
        run: |
          rm -f .github/beta16-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/main/java/atomicstryker/minions/common/MinionManager.java \
            src/main/java/atomicstryker/minions/common/entity/MinionEntity.java \
            gradle.properties README.md
          git add -u -- .github/beta16-trigger
          if ! git diff --cached --quiet; then
            git commit -m "Handle falling gravel in mineshafts"
            git push origin HEAD:agent/beta16-gravel-shaft
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minions-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
