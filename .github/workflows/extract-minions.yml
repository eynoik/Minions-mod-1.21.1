name: Extract Minions source

on:
  push:
    branches:
      - agent/neoforge-1.21.1-bootstrap
    paths:
      - .github/workflows/extract-minions.yml
      - atomicstrykers-minecraft-mods-1.21.1.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/neoforge-1.21.1-bootstrap
          fetch-depth: 0

      - name: Extract Minions project
        shell: bash
        run: |
          set -euo pipefail
          ZIP='atomicstrykers-minecraft-mods-1.21.1.zip'
          test -f "$ZIP"
          rm -rf .extract-minions
          mkdir .extract-minions
          unzip -q "$ZIP" -d .extract-minions

          SRC="$(find .extract-minions -type d \( -iname 'minions' -o -iname 'minions mod' -o -iname 'minions-mod' \) | head -n 1)"
          if [ -z "$SRC" ]; then
            echo 'Could not locate Minions project inside archive'
            find .extract-minions -maxdepth 3 -type d -print
            exit 1
          fi

          echo "Using source directory: $SRC"
          shopt -s dotglob nullglob
          for entry in "$SRC"/*; do
            cp -a "$entry" .
          done

          rm -rf .extract-minions "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extraction changes to commit'
            exit 0
          fi
          git commit -m 'Extract Minions 1.12.2 project [skip ci]'
          git push origin HEAD:agent/neoforge-1.21.1-bootstrap
