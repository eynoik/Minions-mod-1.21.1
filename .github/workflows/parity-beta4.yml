    public void tick() {
        super.tick();
        if (!(level() instanceof ServerLevel serverLevel)) {
            return;
        }

        tickOwnerDespawn(serverLevel);
        if (isRemoved()) {
            return;
        }

        if (pickupDisabledTicks > 0) {
