name: Beta4 parity migration

on:
  push:
    branches:
      - agent/parity-workflow-beta4
    paths:
      - .github/workflows/parity-beta4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-workflow-beta4
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore worker parity systems
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          # Config: old 1 second block tasks + 5 minute orphan despawn.
          p = Path('src/main/java/atomicstryker/minions/common/MinionsConfig.java')
          s = p.read_text()
          s = replace_once(s,
              '    public static final ModConfigSpec.DoubleValue FOLLOW_RANGE;\n',
              '    public static final ModConfigSpec.DoubleValue FOLLOW_RANGE;\n    public static final ModConfigSpec.IntValue AUTOMATIC_DESPAWN_DELAY;\n',
              'config declarations despawn')
          s = replace_once(s,
              '    public static final ModConfigSpec.IntValue CUSTOM_DIG_HEIGHT;\n',
              '    public static final ModConfigSpec.IntValue CUSTOM_DIG_HEIGHT;\n    public static final ModConfigSpec.IntValue WORK_TICKS_PER_BLOCK;\n',
              'config declarations work time')
          s = replace_once(s,
              '        FOLLOW_RANGE = builder.comment("Base follow range of minions.")\n                .defineInRange("followRange", 30.0D, 8.0D, 128.0D);\n',
              '        FOLLOW_RANGE = builder.comment("Base follow range of minions.")\n                .defineInRange("followRange", 30.0D, 8.0D, 128.0D);\n        AUTOMATIC_DESPAWN_DELAY = builder.comment("Seconds before a Minion whose owner is offline/dead despawns and drops its inventory. Legacy default: 300.")\n                .defineInRange("automaticDespawnDelay", 300, 0, 3600);\n',
              'config despawn setting')
          s = replace_once(s,
              '        CUSTOM_DIG_HEIGHT = builder.comment("Default custom dig height. The in-game legacy menu can select 3..25.")\n                .defineInRange("customDigHeight", 3, 3, 25);\n',
              '        CUSTOM_DIG_HEIGHT = builder.comment("Default custom dig height. The in-game legacy menu can select 3..25.")\n                .defineInRange("customDigHeight", 3, 3, 25);\n        WORK_TICKS_PER_BLOCK = builder.comment("Base work time per mined block. Legacy BlockTask default was one second = 20 ticks.")\n                .defineInRange("workTicksPerBlock", 20, 1, 200);\n',
              'config work setting')
          p.write_text(s)

          # Renderer: restore visible working tool layer.
          p = Path('src/main/java/atomicstryker/minions/client/render/MinionRenderer.java')
          s = p.read_text()
          s = replace_once(s,
              'import net.minecraft.client.renderer.entity.MobRenderer;\n',
              'import net.minecraft.client.renderer.entity.MobRenderer;\nimport net.minecraft.client.renderer.entity.layers.ItemInHandLayer;\n',
              'renderer import')
          s = replace_once(s,
              '    public MinionRenderer(EntityRendererProvider.Context context) {\n        super(context, new MinionModel(context.bakeLayer(MinionModel.LAYER)), 0.3F);\n    }\n',
              '    public MinionRenderer(EntityRendererProvider.Context context) {\n        super(context, new MinionModel(context.bakeLayer(MinionModel.LAYER)), 0.3F);\n        addLayer(new ItemInHandLayer<>(this, context.getItemInHandRenderer()));\n    }\n',
              'renderer tool layer')
          p.write_text(s)

          # Command payload: full menu orders, including chest assignment and hard stop.
          p = Path('src/main/java/atomicstryker/minions/network/MinionCommandPayload.java')
          s = p.read_text()
          s = replace_once(s,
              '            case MOVE -> MinionManager.moveTo(player, target);\n',
              '            case MOVE -> MinionManager.moveTo(player, target);\n            case ASSIGN_CHEST -> MinionManager.assignReturnContainer(player, target, arg0 != 0);\n            case STOP_WORK -> MinionManager.stopWork(player);\n',
              'payload cases')
          s = replace_once(s,
              '        MOVE,\n        DIG_STAIRWELL,\n',
              '        MOVE,\n        ASSIGN_CHEST,\n        STOP_WORK,\n        DIG_STAIRWELL,\n',
              'payload enum')
          p.write_text(s)

          # Selection: expose direct world-target commands from the menu.
          Path('src/main/java/atomicstryker/minions/client/MinionSelection.java').write_text(r'''package atomicstryker.minions.client;

import atomicstryker.minions.network.MinionCommandPayload;
import net.minecraft.client.Minecraft;
import net.minecraft.core.BlockPos;
import net.minecraft.core.Direction;
import net.minecraft.world.phys.AABB;
import net.minecraft.world.phys.BlockHitResult;
import net.neoforged.neoforge.network.PacketDistributor;

import java.util.ArrayList;
import java.util.List;

public final class MinionSelection {
    public enum Mode {
        NONE,
        MINESHAFT,
        STRIP_MINE,
        CUSTOM,
        MOVE,
        CHOP_TREE,
        MINE_VEIN,
        ASSIGN_CHEST
    }

    private static Mode mode = Mode.NONE;
    private static BlockPos target;
    private static int customSizeXZ = 3;
    private static int customSizeY = 3;

    private MinionSelection() {
    }

    public static void start(Mode newMode) {
        mode = newMode;
        target = null;
    }

    public static void startCustom(int xzSize, int ySize) {
        customSizeXZ = clampOdd(xzSize, 3, 71);
        customSizeY = Math.max(3, Math.min(25, ySize));
        start(Mode.CUSTOM);
    }

    public static void clear() {
        mode = Mode.NONE;
        target = null;
    }

    public static boolean isActive() {
        return mode != Mode.NONE;
    }

    public static Mode mode() {
        return mode;
    }

    public static int customSizeXZ() {
        return customSizeXZ;
    }

    public static int customSizeY() {
        return customSizeY;
    }

    public static BlockPos target() {
        return target;
    }

    public static void updateFromCrosshair() {
        Minecraft minecraft = Minecraft.getInstance();
        if (minecraft.hitResult instanceof BlockHitResult blockHit) {
            target = mode == Mode.MOVE
                    ? blockHit.getBlockPos().relative(blockHit.getDirection()).immutable()
                    : blockHit.getBlockPos().immutable();
        }
    }

    public static boolean confirm() {
        if (target == null || mode == Mode.NONE) {
            return false;
        }

        Minecraft minecraft = Minecraft.getInstance();
        int sneaking = minecraft.player != null && minecraft.player.isShiftKeyDown() ? 1 : 0;
        MinionCommandPayload payload = switch (mode) {
            case MINESHAFT -> new MinionCommandPayload(MinionCommandPayload.Command.DIG_STAIRWELL, target);
            case STRIP_MINE -> new MinionCommandPayload(MinionCommandPayload.Command.STRIP_MINE, target);
            case CUSTOM -> new MinionCommandPayload(MinionCommandPayload.Command.CUSTOM_DIG, target, customSizeXZ, customSizeY);
            case MOVE -> new MinionCommandPayload(MinionCommandPayload.Command.MOVE, target);
            case CHOP_TREE -> new MinionCommandPayload(MinionCommandPayload.Command.CHOP_TREE, target);
            case MINE_VEIN -> new MinionCommandPayload(MinionCommandPayload.Command.MINE_VEIN, target);
            case ASSIGN_CHEST -> new MinionCommandPayload(MinionCommandPayload.Command.ASSIGN_CHEST, target, sneaking, 0);
            case NONE -> null;
        };
        if (payload == null) {
            return false;
        }
        PacketDistributor.sendToServer(payload);
        clear();
        return true;
    }

    public static AABB mainBox() {
        Minecraft minecraft = Minecraft.getInstance();
        if (target == null || minecraft.player == null) {
            return null;
        }

        Direction direction = directionFromPlayer(target);
        return switch (mode) {
            case MINESHAFT -> new AABB(
                    target.getX(), target.getY(), target.getZ(),
                    target.getX() + 5.0D, target.getY() + 1.0D, target.getZ() + 5.0D
            );
            case STRIP_MINE -> boxBetween(target, target.relative(direction, 2).above());
            case CUSTOM -> customBox(target, direction, customSizeXZ, customSizeY);
            case MOVE, CHOP_TREE, MINE_VEIN, ASSIGN_CHEST -> new AABB(target);
            case NONE -> null;
        };
    }

    public static List<AABB> helperBoxes() {
        List<AABB> boxes = new ArrayList<>();
        if (target == null || mode != Mode.MINESHAFT) {
            return boxes;
        }
        for (int i = 1; i <= 3; i++) {
            BlockPos p = target.offset(i, -i, 0);
            boxes.add(new AABB(p));
        }
        return boxes;
    }

    public static Direction directionFromPlayer(BlockPos start) {
        Minecraft minecraft = Minecraft.getInstance();
        if (minecraft.player == null) {
            return Direction.NORTH;
        }
        int bossX = minecraft.player.blockPosition().getX();
        int bossZ = minecraft.player.blockPosition().getZ();
        int dx = start.getX() - bossX;
        int dz = start.getZ() - bossZ;
        if (Math.abs(dx) > Math.abs(dz)) {
            return dx > 0 ? Direction.EAST : Direction.WEST;
        }
        return dz > 0 ? Direction.SOUTH : Direction.NORTH;
    }

    private static AABB customBox(BlockPos start, Direction direction, int size, int height) {
        int half = (size - 1) / 2;
        int minX;
        int maxX;
        int minZ;
        int maxZ;

        if (direction.getAxis() == Direction.Axis.X) {
            minX = direction == Direction.EAST ? start.getX() : start.getX() - (size - 1);
            maxX = minX + size - 1;
            minZ = start.getZ() - half;
            maxZ = start.getZ() + half;
        } else {
            minZ = direction == Direction.SOUTH ? start.getZ() : start.getZ() - (size - 1);
            maxZ = minZ + size - 1;
            minX = start.getX() - half;
            maxX = start.getX() + half;
        }

        return new AABB(minX, start.getY(), minZ, maxX + 1.0D, start.getY() + height, maxZ + 1.0D);
    }

    private static AABB boxBetween(BlockPos a, BlockPos b) {
        int minX = Math.min(a.getX(), b.getX());
        int minY = Math.min(a.getY(), b.getY());
        int minZ = Math.min(a.getZ(), b.getZ());
        int maxX = Math.max(a.getX(), b.getX()) + 1;
        int maxY = Math.max(a.getY(), b.getY()) + 1;
        int maxZ = Math.max(a.getZ(), b.getZ()) + 1;
        return new AABB(minX, minY, minZ, maxX, maxY, maxZ);
    }

    private static int clampOdd(int value, int min, int max) {
        int result = Math.max(min, Math.min(max, value));
        if ((result & 1) == 0) {
            result = Math.min(max, result + 1);
        }
        return result;
    }
}
''')

          # Full order menu: expose everything that otherwise only exists as a staff gesture.
