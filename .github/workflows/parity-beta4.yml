name: Beta4 parity migration

on:
  push:
    branches:
      - agent/parity-workflow-beta4
    paths:
      - .github/workflows/parity-beta4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-workflow-beta4
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply parity patch
        run: python3 .github/scripts/parity_beta4.py
      - name: Build patched port
        run: ./gradlew build --stacktrace
      - name: Commit patched port
        shell: bash
        run: |
          rm .github/workflows/parity-beta4.yml
          rm .github/scripts/parity_beta4.py
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore animated work and legacy worker workflow"
          git push origin agent/parity-workflow-beta4
