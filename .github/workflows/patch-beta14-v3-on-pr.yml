name: Patch beta.14 ore access v3

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build:
    if: github.head_ref == 'agent/beta14-stripmine-ore-access'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.14 work branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta14-stripmine-ore-access
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply beta.14 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          entity = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = entity.read_text()

          def replace_exact(old, new, label, count=1):
              global s
              found = s.count(old)
              if found < count:
                  raise SystemExit(f'{label}: expected at least {count}, found {found}')
              s = s.replace(old, new, count)

          def replace_regex(pattern, replacement, label, count=1):
              global s
              s, n = re.subn(pattern, replacement, s, count=count, flags=re.M)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, replaced {n}')

          replace_exact(
              '    private final Queue<WorkOrder> workQueue = new ArrayDeque<>();',
              '    private final ArrayDeque<WorkOrder> workQueue = new ArrayDeque<>();',
              'work queue type')

          enqueue_anchor = '\n'.join([
              '    public void enqueueWork(BlockPos pos, int phase) {',
              '        enqueue(new WorkOrder(pos.immutable(), WorkAction.BREAK, null, phase));',
              '    }',
              ''
          ])
          enqueue_new = enqueue_anchor + '\n'.join([
              '    public void enqueueOreWork(BlockPos pos, int phase) {',
              '        enqueue(new WorkOrder(pos.immutable(), WorkAction.ORE_BREAK, null, phase));',
              '    }',
              ''
          ])
          replace_exact(enqueue_anchor, enqueue_new, 'ore enqueue')

          break_validation_old = '\n'.join([
              '        if (order.action() == WorkAction.BREAK || order.action() == WorkAction.TREE_BREAK) {',
              '            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {',
              '                completeCurrentOrder(level);',
              '                return;',
              '            }',
              '        } else {'
          ])
          break_validation_new = break_validation_old.replace(
              'if (order.action() == WorkAction.BREAK || order.action() == WorkAction.TREE_BREAK)',
              'if (isBreakAction(order.action()))')
          replace_exact(break_validation_old, break_validation_new, 'break validation')

          reach_old = '\n'.join([
              '        // Legacy BlockTask_TreeChop inherited the normal 3-block work reach.',
              '        // The Minion must actually walk up to the trunk instead of chopping from afar.',
              '        double workReachSq = 9.0D;'
          ])
          reach_new = '\n'.join([
              '        // Normal jobs keep the legacy 3-block reach. Ore branches use player-like',
              '        // reach so a vein three or four blocks above the 1x2 tunnel does not deadlock.',
              '        double workReachSq = order.action() == WorkAction.ORE_BREAK ? 20.25D : 9.0D;'
          ])
          replace_exact(reach_old, reach_new, 'ore reach')

          replace_exact(
              '} else if (order.action() == WorkAction.BREAK) {',
              '} else if (isBreakAction(order.action())) {',
              'break timing/harvest',
              count=2)
          replace_exact(
              '            if (order.action() == WorkAction.BREAK || order.action() == WorkAction.TREE_BREAK) {',
              '            if (isBreakAction(order.action())) {',
              'break animation')

          nav_start = s.index('        BlockPos navigationTarget;\n')
          nav_end_marker = '        if (stripMining && Math.abs(getY() - navigationTarget.getY()) > 3.0D) {'
          nav_end = s.index(nav_end_marker, nav_start)
          nav_new = '\n'.join([
              '        BlockPos navigationTarget;',
              '        if (order.action() == WorkAction.TREE_BREAK) {',
              '            navigationTarget = findTreeWorkPosition(level, target);',
              '        } else if (stripMining && order.action() == WorkAction.ORE_BREAK) {',
              '            navigationTarget = findStripMineOreWorkPosition(level, target);',
              '            if (navigationTarget == null) {',
              '                OreAccessPlan accessPlan = findOreAccessPlan(level, target, order.phase());',
              '                if (accessPlan != null) {',
              '                    prependOreAccess(order, accessPlan);',
              '                    return;',
              '                }',
              '                navigation.stop();',
              '                stuckTicks++;',
              '                if (stuckTicks > 40) {',
              '                    completeCurrentOrder(level);',
              '                }',
              '                return;',
              '            }',
              '        } else if (stripMining) {',
              '            navigationTarget = findStripMineWorkPosition(level, target);',
              '            if (navigationTarget == null) {',
              '                navigation.stop();',
              '                stuckTicks++;',
              '                if (stuckTicks > 40) {',
              '                    completeCurrentOrder(level);',
              '                }',
              '                return;',
              '            }',
              '        } else {',
              '            navigationTarget = target;',
              '        }',
              '',
          ])
          s = s[:nav_start] + nav_new + s[nav_end:]

          recovery_old = '\n'.join([
              '                } else if (stripMining) {',
              '                    safe = findStripMineWorkPosition(level, target);',
              '                    if (safe == null) {',
              '                        completeCurrentOrder(level);',
              '                        return;',
              '                    }',
              '                } else {'
          ])
          recovery_new = '\n'.join([
              '                } else if (stripMining) {',
              '                    safe = order.action() == WorkAction.ORE_BREAK',
              '                            ? findStripMineOreWorkPosition(level, target)',
              '                            : findStripMineWorkPosition(level, target);',
              '                    if (safe == null) {',
              '                        if (order.action() == WorkAction.ORE_BREAK) {',
              '                            OreAccessPlan accessPlan = findOreAccessPlan(level, target, order.phase());',
              '                            if (accessPlan != null) {',
              '                                prependOreAccess(order, accessPlan);',
              '                                return;',
              '                            }',
              '                        }',
              '                        completeCurrentOrder(level);',
              '                        return;',
              '                    }',
              '                } else {'
          ])
          replace_exact(recovery_old, recovery_new, 'ore recovery')

          adapt_marker = '    private void adaptWorkingTool(BlockState state, WorkAction action) {'
          break_helper = '\n'.join([
              '    private static boolean isBreakAction(WorkAction action) {',
              '        return action == WorkAction.BREAK',
              '                || action == WorkAction.TREE_BREAK',
              '                || action == WorkAction.ORE_BREAK',
              '                || action == WorkAction.ACCESS_BREAK;',
              '    }',
              '',
          ])
          replace_exact(adapt_marker, break_helper + adapt_marker, 'break helper')
          replace_exact(
              '        if (action != WorkAction.BREAK && action != WorkAction.TREE_BREAK) {',
              '        if (!isBreakAction(action)) {',
              'tool guard')
          replace_exact(
              '            case BREAK, TREE_BREAK -> null;',
              '            case BREAK, TREE_BREAK, ORE_BREAK, ACCESS_BREAK -> null;',
              'desired state')

          helper_marker = '    private BlockPos findStripMineWorkPosition(ServerLevel level, BlockPos target) {'
          helper_lines = [
              '    private BlockPos findStripMineOreWorkPosition(ServerLevel level, BlockPos target) {',
              '        BlockPos best = null;',
              '        double bestScore = Double.MAX_VALUE;',
              '',
              '        for (int dy = -3; dy <= 3; dy++) {',
              '            for (int dx = -4; dx <= 4; dx++) {',
              '                for (int dz = -4; dz <= 4; dz++) {',
              '                    double targetDistance = dx * dx + dy * dy + dz * dz;',
              '                    if (targetDistance > 20.25D) {',
              '                        continue;',
              '                    }',
              '                    BlockPos candidate = target.offset(dx, dy, dz);',
              '                    if (!isStripMineStandingPosition(level, candidate)) {',
              '                        continue;',
              '                    }',
              '',
              '                    double workerDistance = distanceToSqr(',
              '                            candidate.getX() + 0.5D, candidate.getY(), candidate.getZ() + 0.5D);',
              '                    double verticalPenalty = Math.abs(candidate.getY() - target.getY()) * 8.0D;',
              '                    double score = targetDistance * 4.0D + workerDistance + verticalPenalty;',
              '                    if (score < bestScore) {',
              '                        bestScore = score;',
              '                        best = candidate.immutable();',
              '                    }',
              '                }',
              '            }',
              '        }',
              '        return best;',
              '    }',
              '',
              '    private OreAccessPlan findOreAccessPlan(ServerLevel level, BlockPos target, int phase) {',
              '        BlockPos workerPos = blockPosition();',
              '        OreAccessPlan best = null;',
              '        double bestScore = Double.MAX_VALUE;',
              '',
              '        for (int dy = -3; dy <= 3; dy++) {',
              '            for (int dx = -4; dx <= 4; dx++) {',
              '                for (int dz = -4; dz <= 4; dz++) {',
              '                    double targetDistance = dx * dx + dy * dy + dz * dz;',
              '                    if (targetDistance > 20.25D) {',
              '                        continue;',
              '                    }',
              '',
              '                    BlockPos candidate = target.offset(dx, dy, dz);',
              '                    if (candidate.equals(target) || candidate.above().equals(target)) {',
              '                        continue;',
              '                    }',
              '                    if (Math.abs(candidate.getY() - workerPos.getY()) > 1) {',
              '                        continue;',
              '                    }',
              '                    int horizontalDistance = Math.abs(candidate.getX() - workerPos.getX())',
              '                            + Math.abs(candidate.getZ() - workerPos.getZ());',
              '                    if (horizontalDistance > 2) {',
              '                        continue;',
              '                    }',
              '',
              '                    List<WorkOrder> helpers = new java.util.ArrayList<>(2);',
              '                    BlockState feet = level.getBlockState(candidate);',
              '                    if (!feet.isAir()) {',
              '                        if (!canClearOreAccessBlock(level, candidate, feet)) {',
              '                            continue;',
              '                        }',
              '                        helpers.add(new WorkOrder(candidate.immutable(), WorkAction.ACCESS_BREAK, null, phase));',
              '                    }',
              '',
              '                    BlockPos headPos = candidate.above();',
              '                    BlockState head = level.getBlockState(headPos);',
              '                    if (!head.isAir()) {',
              '                        if (!canClearOreAccessBlock(level, headPos, head)) {',
              '                            continue;',
              '                        }',
              '                        helpers.add(new WorkOrder(headPos.immutable(), WorkAction.ACCESS_BREAK, null, phase));',
              '                    }',
              '',
              '                    BlockPos floorPos = candidate.below();',
              '                    BlockState floor = level.getBlockState(floorPos);',
              '                    if (floor.isAir()) {',
              '                        BlockPos supportPos = floorPos.below();',
              '                        BlockState support = level.getBlockState(supportPos);',
              '                        if (!support.isFaceSturdy(level, supportPos, Direction.UP)) {',
              '                            continue;',
              '                        }',
              '                        helpers.add(new WorkOrder(floorPos.immutable(), WorkAction.PLACE_DIRT, null, phase));',
              '                    } else if (!floor.isFaceSturdy(level, floorPos, Direction.UP)) {',
              '                        continue;',
              '                    }',
              '',
              '                    if (helpers.isEmpty() || helpers.size() > 2) {',
              '                        continue;',
              '                    }',
              '',
              '                    boolean reachableHelpers = true;',
              '                    for (WorkOrder helper : helpers) {',
              '                        BlockPos helperPos = helper.pos();',
              '                        if (distanceToSqr(helperPos.getX() + 0.5D, helperPos.getY() + 0.5D, helperPos.getZ() + 0.5D) > 9.0D) {',
              '                            reachableHelpers = false;',
              '                            break;',
              '                        }',
              '                    }',
              '                    if (!reachableHelpers) {',
              '                        continue;',
              '                    }',
              '',
              '                    double workerDistance = distanceToSqr(',
              '                            candidate.getX() + 0.5D, candidate.getY(), candidate.getZ() + 0.5D);',
              '                    double score = helpers.size() * 1000.0D + targetDistance * 10.0D + workerDistance;',
              '                    if (score < bestScore) {',
              '                        bestScore = score;',
              '                        best = new OreAccessPlan(List.copyOf(helpers));',
              '                    }',
              '                }',
              '            }',
              '        }',
              '        return best;',
              '    }',
              '',
              '    private boolean canClearOreAccessBlock(ServerLevel level, BlockPos pos, BlockState state) {',
              '        return state.getDestroySpeed(level, pos) >= 0.0F',
              '                && !state.hasBlockEntity()',
              '                && (state.is(BlockTags.BASE_STONE_OVERWORLD) || state.is(BlockTags.BASE_STONE_NETHER));',
              '    }',
              '',
              '    private void prependOreAccess(WorkOrder oreOrder, OreAccessPlan accessPlan) {',
              '        WorkOrder current = workQueue.pollFirst();',
              '        if (current == null || !current.equals(oreOrder)) {',
              '            if (current != null) {',
              '                workQueue.addFirst(current);',
              '            }',
              '            return;',
              '        }',
              '',
              '        workQueue.addFirst(oreOrder);',
              '        List<WorkOrder> helpers = accessPlan.helpers();',
              '        for (int i = helpers.size() - 1; i >= 0; i--) {',
              '            workQueue.addFirst(helpers.get(i));',
              '        }',
              '        resetActiveWork();',
              '        stuckTicks = 0;',
              '        entityData.set(WORKING, true);',
              '    }',
              '',
          ]
          replace_exact(helper_marker, '\n'.join(helper_lines) + helper_marker, 'ore helper methods')

          enum_old = '\n'.join([
              '    public enum WorkAction {',
              '        BREAK,',
              '        PLACE_COBBLE,',
              '        PLACE_DIRT,',
              '        PLACE_STAIR,',
              '        PLACE_TORCH,',
              '        TREE_BREAK',
              '    }'
          ])
          enum_new = '\n'.join([
              '    public enum WorkAction {',
              '        BREAK,',
              '        PLACE_COBBLE,',
              '        PLACE_DIRT,',
              '        PLACE_STAIR,',
              '        PLACE_TORCH,',
              '        TREE_BREAK,',
              '        ORE_BREAK,',
              '        ACCESS_BREAK',
              '    }'
          ])
          replace_exact(enum_old, enum_new, 'work action enum')

          work_record = '    public record WorkOrder(BlockPos pos, WorkAction action, Direction facing, int phase) {'
          access_record = '\n'.join([
              '    private record OreAccessPlan(List<WorkOrder> helpers) {',
              '    }',
              '',
          ])
          replace_exact(work_record, access_record + work_record, 'ore access record')

          entity.write_text(s)

          manager = Path('src/main/java/atomicstryker/minions/common/MinionManager.java')
          m = manager.read_text()
          scan_start = m.index('    private static void scanValuableVein')
          ore_line = '            queueBreak(worker, queued, pos, phase);'
          ore_index = m.index(ore_line, scan_start)
          m = m[:ore_index] + '            queueOreBreak(worker, queued, pos, phase);' + m[ore_index + len(ore_line):]

          valuable_marker = '    private static boolean isValuable(ServerLevel level, BlockPos pos) {'
          ore_queue_method = '\n'.join([
              '    private static void queueOreBreak(MinionEntity worker, Set<BlockPos> queued, BlockPos pos, int phase) {',
              '        if (queued.add(pos.immutable())) {',
              '            worker.enqueueOreWork(pos, phase);',
              '        }',
              '    }',
              '',
          ])
          if valuable_marker not in m:
              raise SystemExit('valuable marker missing')
          m = m.replace(valuable_marker, ore_queue_method + valuable_marker, 1)
          manager.write_text(m)

          gradle = Path('gradle.properties')
          g = gradle.read_text()
          if 'mod_version=2.0.3-1.21.1-beta.13' not in g:
              raise SystemExit('beta.13 version marker missing')
          gradle.write_text(g.replace('mod_version=2.0.3-1.21.1-beta.13', 'mod_version=2.0.3-1.21.1-beta.14', 1))

          readme = Path('README.md')
          r = readme.read_text()
          if '**Current version: `2.0.3-1.21.1-beta.13`**' not in r:
              raise SystemExit('README version marker missing')
          r = r.replace('**Current version: `2.0.3-1.21.1-beta.13`**', '**Current version: `2.0.3-1.21.1-beta.14`**', 1)
          r = r.replace(
              '- 1x2 strip mining with common `c:ores` scanning, stall recovery, floor repair and torches',
              '- 1x2 strip mining with common `c:ores` scanning, bounded ore-access recovery, floor repair and torches',
              1)
          readme.write_text(r)
          PY

      - name: Build beta.14
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit beta.14 source
        shell: bash
        run: |
          rm -f .github/beta14-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/main/java/atomicstryker/minions/common/entity/MinionEntity.java \
            src/main/java/atomicstryker/minions/common/MinionManager.java \
            gradle.properties \
            README.md
          git add -u -- .github/beta14-trigger
          git commit -m "Improve strip mine ore access"
          git push origin HEAD:agent/beta14-stripmine-ore-access
