name: Beta.16 gravity settle patch source

on:
  workflow_dispatch:

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - name: Embedded patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = p.read_text()

          def sub_once(pattern, replacement, label, flags=0):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: marker not found')
              s = s2

          if 'private boolean shaftWaitingForGravity;' not in s:
              sub_once(
                  r'(?m)^(\s*)private int workBoostTicks;\s*$',
                  r'\1private int workBoostTicks;\n\1private int shaftGravityWaitTicks;\n\1private boolean shaftWaitingForGravity;',
                  'gravity fields')

          if 'shaftGravityWaitTicks < 10' not in s:
              validation_pattern = (
                  r'(?ms)^(\s*)if \(isBreakAction\(order\.action\(\)\)\) \{\s*'
                  r'if \(state\.isAir\(\) \|\| state\.getDestroySpeed\(level, target\) < 0\.0F\) \{\s*'
                  r'completeCurrentOrder\(level\);\s*return;\s*\}\s*\} else \{'
              )
              validation_replacement = '''        if (isBreakAction(order.action())) {
            if (order.action() == WorkAction.SHAFT_BREAK && shaftWaitingForGravity) {
                if (state.isAir()) {
                    shaftGravityWaitTicks++;
                    if (shaftGravityWaitTicks < 10) {
                        entityData.set(WORKING, false);
                        navigation.stop();
                        return;
                    }
                    shaftWaitingForGravity = false;
                    shaftGravityWaitTicks = 0;
                    completeCurrentOrder(level);
                    return;
                }
                shaftWaitingForGravity = false;
                shaftGravityWaitTicks = 0;
            }
            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {
                completeCurrentOrder(level);
                return;
            }
        } else {'''
              sub_once(validation_pattern, validation_replacement, 'gravity validation')

          if 'shaftWaitingForGravity = true;' not in s:
              retention_pattern = (
                  r'(?ms)BlockState above = level\.getBlockState\(target\.above\(\)\);\s*'
                  r'if \(above\.getBlock\(\) instanceof FallingBlock\) \{\s*'
                  r'workTicks = 0;\s*stuckTicks = 0;\s*return;\s*\}'
              )
              retention_replacement = '''BlockState above = level.getBlockState(target.above());
                    if (above.getBlock() instanceof FallingBlock || state.getBlock() instanceof FallingBlock) {
                        shaftWaitingForGravity = true;
                        shaftGravityWaitTicks = 0;
                        workTicks = 0;
                        stuckTicks = 0;
                        return;
                    }'''
              sub_once(retention_pattern, retention_replacement, 'gravity retention')

          if 'shaftGravityWaitTicks = 0;\n        shaftWaitingForGravity = false;\n        entityData.set(WORKING, false);' not in s:
              complete_pattern = r'(?m)^(\s*)workTicks = 0;\s*\n\s*stuckTicks = 0;\s*\n\s*entityData\.set\(WORKING, false\);'
              complete_replacement = r'\1workTicks = 0;\n\1stuckTicks = 0;\n\1shaftGravityWaitTicks = 0;\n\1shaftWaitingForGravity = false;\n\1entityData.set(WORKING, false);'
              sub_once(complete_pattern, complete_replacement, 'complete reset')

          if 'shaftGravityWaitTicks = 0;\n        shaftWaitingForGravity = false;\n    }\n\n    private BlockState desiredState' not in s:
              reset_pattern = (
                  r'(?ms)^(\s*)activeTreeLeaves = List\.of\(\);\s*\n'
                  r'\s*workTicks = 0;\s*\n\s*\}\s*\n\s*private BlockState desiredState'
              )
              reset_replacement = '''        activeTreeLeaves = List.of();
        workTicks = 0;
        shaftGravityWaitTicks = 0;
        shaftWaitingForGravity = false;
    }

    private BlockState desiredState'''
              sub_once(reset_pattern, reset_replacement, 'active reset')

          p.write_text(s)
          PY
