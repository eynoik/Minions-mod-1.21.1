name: Patch beta.16 gravel-safe shaft

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-beta16-gravel-shaft.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta16-gravel-shaft
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply beta.16 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: marker not found')
              return text.replace(old, new, 1)

          manager = Path('src/main/java/atomicstryker/minions/common/MinionManager.java')
          s = manager.read_text()
          pattern = re.compile(r'    public static void digStairwell\(ServerPlayer player, BlockPos start\) \{.*?\n    \}\n\n    public static void stripMine', re.S)
          replacement = '''    public static void digStairwell(ServerPlayer player, BlockPos start) {
        ServerLevel level = player.serverLevel();
        List<QueuedWork> work = new ArrayList<>();
        int startY = start.getY();
        int currentSegment = 0;
        int minY = level.getMinBuildHeight() + 8;

        for (int depth = 0; startY - depth > minY; depth++) {
            if (depth % 3 == 0) {
                currentSegment++;
                if (currentSegment == 5) {
                    currentSegment = 1;
                }
            }

            int clearPhase = depth * 2 + 1;
            int buildPhase = clearPhase + 1;
            List<QueuedWork> buildLayer = new ArrayList<>();

            // Clear the complete 5x5 layer first, including future stair/cobble cells.
            // SHAFT_BREAK is gravity-aware: if gravel/sand is sitting directly above
            // a removed support block, the Minion keeps the same order alive until
            // the falling column has settled into that cell and has been cleared.
            for (int xDiff = 0; xDiff <= 4; xDiff++) {
                for (int zDiff = 0; zDiff <= 4; zDiff++) {
                    BlockPos pos = start.offset(xDiff, -depth, zDiff);
                    work.add(QueuedWork.shaftBreak(pos, clearPhase));

                    if (isStairwellCorner(depth, currentSegment, xDiff, zDiff)) {
                        buildLayer.add(QueuedWork.placeCobble(pos, buildPhase));
                    } else {
                        Direction stairFacing = stairFacing(depth, currentSegment, xDiff, zDiff);
                        if (stairFacing != null) {
                            buildLayer.add(QueuedWork.placeStair(pos, stairFacing, buildPhase));
                        }
                    }
                }
            }

            // Only build after every Minion has finished clearing and settling this
            // layer. The next depth cannot start until the build phase is complete.
            work.addAll(buildLayer);
        }

        assignOrders(player, work);
        if (!work.isEmpty()) {
            playOrder(player, MinionsSounds.ORDER_MINESHAFT.get());
            exhaustBig(player);
        }
    }

    public static void stripMine'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('digStairwell method marker not found')
          s = replace_once(s,
              '                case BREAK -> worker.enqueueWork(order.pos, order.phase);',
              '                case BREAK -> worker.enqueueWork(order.pos, order.phase);\n                case SHAFT_BREAK -> worker.enqueueShaftWork(order.pos, order.phase);',
              'assign shaft action')
          s = replace_once(s,
              '        BREAK,\n        COBBLE,',
              '        BREAK,\n        SHAFT_BREAK,\n        COBBLE,',
              'order enum')
          s = replace_once(s,
              '        private static QueuedWork placeCobble(BlockPos pos, int phase) {',
              '        private static QueuedWork shaftBreak(BlockPos pos, int phase) {\n            return new QueuedWork(pos.immutable(), OrderAction.SHAFT_BREAK, null, phase);\n        }\n\n        private static QueuedWork placeCobble(BlockPos pos, int phase) {',
              'shaft factory')
          manager.write_text(s)

          entity = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = entity.read_text()
          s = replace_once(s,
              'import net.minecraft.world.level.block.Blocks;\n',
              'import net.minecraft.world.level.block.Blocks;\nimport net.minecraft.world.level.block.FallingBlock;\n',
              'falling block import')
          s = replace_once(s,
              '    public void enqueueOreWork(BlockPos pos, int phase) {\n        enqueue(new WorkOrder(pos.immutable(), WorkAction.ORE_BREAK, null, phase));\n    }',
              '    public void enqueueOreWork(BlockPos pos, int phase) {\n        enqueue(new WorkOrder(pos.immutable(), WorkAction.ORE_BREAK, null, phase));\n    }\n\n    public void enqueueShaftWork(BlockPos pos, int phase) {\n        enqueue(new WorkOrder(pos.immutable(), WorkAction.SHAFT_BREAK, null, phase));\n    }',
              'shaft enqueue')
          s = replace_once(s,
              '        if (isBreakAction(order.action())) {\n            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {\n                completeCurrentOrder(level);\n                return;\n            }\n        } else {',
              '        if (isBreakAction(order.action())) {\n            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {\n                completeCurrentOrder(level);\n                return;\n            }\n        } else {',
              'break validation anchor')
          s = replace_once(s,
              '            } else if (isBreakAction(order.action())) {\n                harvestBlockIntoInventory(level, target, state);\n            } else {',
              '''            } else if (isBreakAction(order.action())) {
                harvestBlockIntoInventory(level, target, state);
                if (order.action() == WorkAction.SHAFT_BREAK) {
                    // Removing a shaft support can schedule gravel/sand above it to
                    // fall a moment later. Do not retire this coordinate while a
                    // gravity block is directly above; keep revisiting the same cell
                    // so the falling material gets mined instead of clogging the shaft.
                    BlockState above = level.getBlockState(target.above());
                    if (above.getBlock() instanceof FallingBlock) {
                        workTicks = 0;
                        stuckTicks = 0;
                        return;
                    }
                }
            } else {''',
              'shaft falling retention')
          s = replace_once(s,
              '                || action == WorkAction.ORE_BREAK\n                || action == WorkAction.ACCESS_BREAK;',
              '                || action == WorkAction.ORE_BREAK\n                || action == WorkAction.ACCESS_BREAK\n                || action == WorkAction.SHAFT_BREAK;',
              'break action set')
          s = replace_once(s,
              '            case BREAK, TREE_BREAK, ORE_BREAK, ACCESS_BREAK -> null;',
              '            case BREAK, TREE_BREAK, ORE_BREAK, ACCESS_BREAK, SHAFT_BREAK -> null;',
              'desired state')
          s = replace_once(s,
              '        ACCESS_BREAK\n    }',
              '        ACCESS_BREAK,\n        SHAFT_BREAK\n    }',
              'work action enum')
          entity.write_text(s)

          gradle = Path('gradle.properties')
          s = gradle.read_text()
          s = replace_once(s, 'mod_version=2.0.3-1.21.1-beta.15', 'mod_version=2.0.3-1.21.1-beta.16', 'version')
          gradle.write_text(s)

          readme = Path('README.md')
          s = readme.read_text()
          s = replace_once(s, '**Current version: `2.0.3-1.21.1-beta.15`**', '**Current version: `2.0.3-1.21.1-beta.16`**', 'readme version')
          s = replace_once(s, '- 5x5 spiral mineshafts', '- 5x5 spiral mineshafts with falling gravel/sand cleanup', 'readme shaft')
          readme.write_text(s)
          PY

      - name: Build beta.16
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit beta.16 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/main/java/atomicstryker/minions/common/MinionManager.java \
            src/main/java/atomicstryker/minions/common/entity/MinionEntity.java \
            gradle.properties README.md
          git commit -m "Handle falling gravel in mineshafts"
          git push origin HEAD:agent/beta16-gravel-shaft
