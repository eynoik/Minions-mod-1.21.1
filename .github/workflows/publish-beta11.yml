name: Publish beta.11 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta11.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.11 source
        uses: actions/checkout@v4
        with:
          ref: dd9f6cc0e968d4c9c9e8ddf45b40247c99fd4f25

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create beta.11 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.11
          RELEASE_TARGET: dd9f6cc0e968d4c9c9e8ddf45b40247c99fd4f25
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/minions-2.0.3-1.21.1-beta.11.jar"
          test -f "$JAR"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Minions — Minecraft 1.21.1 NeoForge beta.11

          Unofficial, non-commercial NeoForge 1.21.1 port of AtomicStryker's Minecraft Minions.

          **1.21.1 port / fixes / maintenance:** meynoik  
          **Original mod:** AtomicStryker

          ### beta.11

          - increases Minion base movement speed from 0.225 to 0.30 (about 33% faster)
          - restores a snappier walking feel closer to the legacy mod while retaining modern vanilla navigation
          - mining speed, task timings, work boost, inventory and all job logic are unchanged

          ### Permission / copyright

          This release is non-commercial. Original Minecraft Minions code/assets remain credited to AtomicStryker and are not relicensed by this project. See the repository README for upstream links and AtomicStryker's published copyright/permission statements.
          EOF

          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Minions 1.21.1 — beta.11" \
            --notes-file /tmp/release-notes.md \
            --prerelease
