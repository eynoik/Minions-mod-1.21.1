name: Publish beta.13 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta13.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.13 source
        uses: actions/checkout@v4
        with:
          ref: 505eefc32def335917918fa8f96cc64449368470

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build beta.13
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Create beta.13 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.13
          RELEASE_TARGET: 505eefc32def335917918fa8f96cc64449368470
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/minions-2.0.3-1.21.1-beta.13.jar"
          test -f "$JAR"
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Minions 1.21.1 — beta.13" \
            --notes "Fixes strip mining and Minion persistence away from players. Strip mines now detect only blocks in the NeoForge common c:ores tag, so sculk, andesite and unrelated modded blocks are no longer treated as ore. Fixed a beta.12 deadlock where an unreachable strip-mine task could make a Minion path to its own position forever. Restored NeoForge ticking chunk tickets: idle Minions keep their current chunk loaded and active Minions keep a 3x3 work area loaded while moving or working. Removed the direct right-click-on-log shortcut; tree harvesting remains available through the Minion Orders command."
