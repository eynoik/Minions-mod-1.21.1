name: Publish beta.14 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta14.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.14 source
        uses: actions/checkout@v4
        with:
          ref: 48138d6ba6576ba0fa8ff4d5e8c1b11825fde72c
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build beta.14
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Publish or verify beta.14 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.14
          RELEASE_TARGET: 48138d6ba6576ba0fa8ff4d5e8c1b11825fde72c
          JAR_NAME: minions-2.0.3-1.21.1-beta.14.jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/$JAR_NAME"
          test -f "$JAR"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Minions 1.21.1 — beta.14" \
              --notes "Strip-mine ore access fix. Ore branches now use dedicated ORE_BREAK tasks with a player-like 4.5-block work reach, so ores several blocks above the 1x2 tunnel can be mined without freezing the job. If no normal standing cell exists, a Minion may make at most two bounded access changes: clear only ordinary overworld/nether base-stone blocks and/or fill a one-block-deep hole with dirt. It will not clear block entities, sculk or arbitrary modded blocks, and it will not bridge deep gaps. If safe access still cannot be made, only that ore task is skipped and the main strip mine continues. Includes beta.13 c:ores filtering and chunk loading fixes." \
              --prerelease \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$JAR_NAME"

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github
          printf 'tag=%s\nasset=%s\ntarget=%s\n' "$TAG" "$JAR_NAME" "$RELEASE_TARGET" > .github/beta14-published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/beta14-published
          if ! git diff --cached --quiet; then
            git commit -m "Confirm beta.14 release"
            git push origin main
          fi
