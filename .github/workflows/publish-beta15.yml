name: Publish beta.15 prerelease
# retrigger: verify release publication

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta15.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.15 source
        uses: actions/checkout@v4
        with:
          ref: 5ec5b97467f2d77c59ecf9a5c65b22f2bde49ba2
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build beta.15
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Publish or verify beta.15 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.15
          RELEASE_TARGET: 5ec5b97467f2d77c59ecf9a5c65b22f2bde49ba2
          JAR_NAME: minions-2.0.3-1.21.1-beta.15.jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/$JAR_NAME"
          test -f "$JAR"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Minions 1.21.1 — beta.15" \
              --notes "Recall and hunger-cost update. When the Master's Staff is used to summon/move Minions, owned Minions farther than 48 blocks are recalled next to their owner before the normal order continues. Recall also works across dimensions, clears old work/move state and releases old chunk-loading tickets first. Default food exhaustion is reduced from 20.0 to 15.0 for expensive orders and from 1.5 to 1.0 for small actions. Existing configs that still contain the exact old defaults are migrated at runtime, while custom values remain respected. Includes all beta.14 strip-mine ore-access fixes." \
              --prerelease
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$JAR_NAME"

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github
          printf 'tag=%s\nasset=%s\ntarget=%s\n' "$TAG" "$JAR_NAME" "$RELEASE_TARGET" > .github/beta15-published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/beta15-published
          if ! git diff --cached --quiet; then
            git commit -m "Confirm beta.15 release"
            git push origin main
          fi
