name: Publish beta.16 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta16.yml'

permissions:
  contents: write

# second commit intentionally triggers publication
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.16 source
        uses: actions/checkout@v4
        with:
          ref: 90758dc64ed815cb76ec2365d264543336b64edb
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build beta.16
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Publish or verify beta.16 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.16
          RELEASE_TARGET: 90758dc64ed815cb76ec2365d264543336b64edb
          JAR_NAME: minions-2.0.3-1.21.1-beta.16.jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/$JAR_NAME"
          test -f "$JAR"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Minions 1.21.1 — beta.16" \
              --notes "Mineshaft gravity fix. Spiral 5x5 shafts now clear an entire layer before placing stairs/cobble and use a dedicated gravity-aware SHAFT_BREAK task. When gravel, sand or another falling block is triggered, Minions keep the affected shaft coordinate alive and wait for the falling material to settle instead of treating temporary air as finished. If material lands there, it is mined and the settle cycle repeats before the shaft advances. Includes all beta.15 recall and reduced hunger-cost changes." \
              --prerelease
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$JAR_NAME"

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github
          printf 'tag=%s\nasset=%s\ntarget=%s\n' "$TAG" "$JAR_NAME" "$RELEASE_TARGET" > .github/beta16-published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/beta16-published
          if ! git diff --cached --quiet; then
            git commit -m "Confirm beta.16 release"
            git push origin main
          fi
