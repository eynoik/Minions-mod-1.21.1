name: Publish beta.6 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta6.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create beta.6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.6
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/minions-2.0.3-1.21.1-beta.6.jar"
          test -f "$JAR"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Minions — Minecraft 1.21.1 NeoForge beta.6

          Unofficial, non-commercial NeoForge 1.21.1 port of AtomicStryker's Minecraft Minions.

          **1.21.1 port / fixes / maintenance:** meynoik  
          **Original mod:** AtomicStryker

          This beta focuses on restoring the original Minions workflow on modern Minecraft: old-style menus and selection grids, evil deeds and original sounds, animated tool-based work, nearby forest harvesting, mineshafts, independent strip mines, custom digging, backpack return/resume behavior, carrying, despawn behavior and repeated Master's Staff orders.

          The port is still beta software and may contain behavior differences or runtime bugs. Minions can modify large areas of terrain, so backups of important worlds are recommended.

          ### Permission / copyright

          This release is non-commercial. Original Minecraft Minions code/assets remain credited to AtomicStryker and are not relicensed by this project. See the repository README for upstream links and AtomicStryker's published copyright/permission statements.
          EOF

          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Minions 1.21.1 — beta.6" \
            --notes-file /tmp/release-notes.md \
            --prerelease
