name: Publish beta.9 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta9.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create beta.9 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 2.0.3-1.21.1-beta.9
          RELEASE_TARGET: 35302a119ec0623281866fabe6f0a1dd1bc91c29
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/minions-2.0.3-1.21.1-beta.9.jar"
          test -f "$JAR"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Minions — Minecraft 1.21.1 NeoForge beta.9

          Unofficial, non-commercial NeoForge 1.21.1 port of AtomicStryker's Minecraft Minions.

          **1.21.1 port / fixes / maintenance:** meynoik  
          **Original mod:** AtomicStryker

          ### beta.9

          - Minion max health increased from 20 to 24 HP
          - explicit immunity to fall damage from any height
          - Master's Staff lightning no longer damages or ignites Minions
          - keeps the existing cave/environment hazard immunity
          - includes all beta.8 whole-tree harvesting changes and earlier restored 1.12.2-style Minions systems

          This remains a beta port. Backups are recommended when using large excavation orders.

          ### Permission / copyright

          This release is non-commercial. Original Minecraft Minions code/assets remain credited to AtomicStryker and are not relicensed by this project. See the repository README for upstream links and AtomicStryker's published copyright/permission statements.
          EOF

          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Minions 1.21.1 — beta.9" \
            --notes-file /tmp/release-notes.md \
            --prerelease
