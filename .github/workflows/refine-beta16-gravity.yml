name: Refine beta.16 gravity settle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refine-beta16-gravity.yml'

permissions:
  contents: write

# second commit intentionally triggers this one-shot workflow
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.16 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta16-gravel-shaft
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Add real falling-block settle wait
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/atomicstryker/minions/common/entity/MinionEntity.java')
          s = p.read_text()

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: marker not found')
              s = s.replace(old, new, 1)

          if 'private boolean shaftWaitingForGravity;' not in s:
              one(
                  '    private int workBoostTicks;\n',
                  '    private int workBoostTicks;\n    private int shaftGravityWaitTicks;\n    private boolean shaftWaitingForGravity;\n',
                  'gravity fields')

          old_validation = '''        if (isBreakAction(order.action())) {
            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {
                completeCurrentOrder(level);
                return;
            }
        } else {'''
          new_validation = '''        if (isBreakAction(order.action())) {
            if (order.action() == WorkAction.SHAFT_BREAK && shaftWaitingForGravity) {
                if (state.isAir()) {
                    shaftGravityWaitTicks++;
                    if (shaftGravityWaitTicks < 10) {
                        entityData.set(WORKING, false);
                        navigation.stop();
                        return;
                    }
                    shaftWaitingForGravity = false;
                    shaftGravityWaitTicks = 0;
                    completeCurrentOrder(level);
                    return;
                }
                shaftWaitingForGravity = false;
                shaftGravityWaitTicks = 0;
            }
            if (state.isAir() || state.getDestroySpeed(level, target) < 0.0F) {
                completeCurrentOrder(level);
                return;
            }
        } else {'''
          if 'shaftGravityWaitTicks < 10' not in s:
              one(old_validation, new_validation, 'gravity validation')

          old_retention = '''          BlockState above = level.getBlockState(target.above());
          if (above.getBlock() instanceof FallingBlock) {
              workTicks = 0;
              stuckTicks = 0;
              return;
          }'''
          new_retention = '''          BlockState above = level.getBlockState(target.above());
          if (above.getBlock() instanceof FallingBlock || state.getBlock() instanceof FallingBlock) {
              shaftWaitingForGravity = true;
              shaftGravityWaitTicks = 0;
              workTicks = 0;
              stuckTicks = 0;
              return;
          }'''
          if old_retention in s:
              one(old_retention, new_retention, 'gravity retention')

          if 'shaftGravityWaitTicks = 0;\n        shaftWaitingForGravity = false;\n        entityData.set(WORKING, false);' not in s:
              one(
                  '''        workTicks = 0;
        stuckTicks = 0;
        entityData.set(WORKING, false);''',
                  '''        workTicks = 0;
        stuckTicks = 0;
        shaftGravityWaitTicks = 0;
        shaftWaitingForGravity = false;
        entityData.set(WORKING, false);''',
                  'complete reset')

          if 'workTicks = 0;\n        shaftGravityWaitTicks = 0;\n        shaftWaitingForGravity = false;\n    }\n\n    private BlockState desiredState' not in s:
              one(
                  '''        activeTreeLeaves = List.of();
        workTicks = 0;
    }

    private BlockState desiredState''',
                  '''        activeTreeLeaves = List.of();
        workTicks = 0;
        shaftGravityWaitTicks = 0;
        shaftWaitingForGravity = false;
    }

    private BlockState desiredState''',
                  'active reset')

          p.write_text(s)
          PY

      - name: Build refined beta.16
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit refined beta.16
        shell: bash
        run: |
          rm -f .github/beta16-settle-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main/java/atomicstryker/minions/common/entity/MinionEntity.java
          git add -u -- .github/beta16-settle-trigger
          if ! git diff --cached --quiet; then
            git commit -m "Wait for falling blocks to settle in mineshafts"
            git push origin HEAD:agent/beta16-gravel-shaft
          fi
