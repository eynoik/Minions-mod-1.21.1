name: Run beta.13 fix build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-beta13-patch.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.13 work branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta13-stripmine-chunkloading-work
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Execute patch embedded in work branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-beta13-fixes.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('embedded beta.13 patch script not found')
          exec(compile(textwrap.dedent(match.group(1)), 'beta13_patch.py', 'exec'))
          PY

      - name: Build beta.13
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Commit beta.13 source
        shell: bash
        run: |
          rm .github/workflows/apply-beta13-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strip mining and restore Minion chunk loading"
          git push origin HEAD:agent/beta13-stripmine-chunkloading-work
