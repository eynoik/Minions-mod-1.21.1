name: Run beta.7 parity patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-beta7-patch.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta.7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta7-parity-fixes
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply source patch
        run: python tools/apply_beta7.py

      - name: Remove branch-only patch tooling
        run: rm -f tools/apply_beta7.py .github/workflows/apply-beta7.yml

      - name: Build patched mod
        run: ./gradlew build --stacktrace

      - name: Commit patched source to feature branch
        run: |
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore mining drops animation menu gating and hazard immunity"
          git push origin HEAD:agent/beta7-parity-fixes
