name: One-shot tree and drop parity fix

on:
  push:
    branches:
      - agent/tree-range-drop-fix
    paths:
      - .github/workflows/tree-drop-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tree-range-drop-fix
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/tree_drop_patch.py
      - name: Commit patch
        run: |
          rm .github/tree_drop_patch.py .github/workflows/tree-drop-fix.yml
          git config user.name "meynoik"
          git config user.email "neynoi.k@gmail.com"
          git add -A
          git commit -m "Restore legacy tree harvesting and item throws [skip ci]"
          git push origin agent/tree-range-drop-fix
